services:
  web:
    build:
      context: ./apache-php
    container_name: lamp_web
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html:ro
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lamp_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mariadb:11.4
    container_name: lamp_db
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - lamp_network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  lamp_network:
    driver: bridge

volumes:
  db_data:
